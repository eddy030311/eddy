<title>Ave Mujica 假面回廊</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b080d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Noto+Serif+SC:wght@400;700;900&family=Silkscreen&display=swap">
<style>
/* Layout: one fixed full-screen stage (canvas) with HTML overlays for HUD, touch pad and menus. Single dark gothic look by choice. */
:root{
  --ink:#0b080d; --velvet:#1c0d14; --blood:#9b1b30; --rose:#d0405a; --gold:#c9a45c; --bone:#ece2d2; --mist:#8d8497; --line:#3a2a33;
  --f-display:"UnifrakturMaguntia","Noto Serif SC",serif;
  --f-body:"Noto Serif SC","Songti SC","STSong",serif;
  --f-pixel:"Silkscreen",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);overflow:hidden;overscroll-behavior:none;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--f-body)}
#game{position:fixed;inset:0;touch-action:none}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated}
#vig,#tint{position:absolute;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse 72% 80% at 50% 50%,rgba(5,2,8,0) 42%,rgba(5,2,8,.72) 100%)}
#game:not(.playing) #vig{display:none}
#game.dark #vig{background:radial-gradient(ellipse 34% 46% at 50% 50%,rgba(5,2,8,0) 30%,rgba(5,2,8,.96) 100%)}
#tint{opacity:0}
button{font-family:var(--f-body);color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  display:flex;align-items:flex-start;gap:10px}
#hud .rbox{margin-left:auto}
.hpbox{min-width:0;flex:1;max-width:220px}
.port{flex:0 0 auto;width:40px;height:60px;margin-right:-4px;background:url(assets/portraits.png) no-repeat;background-size:500% 100%;filter:drop-shadow(0 2px 0 #000)}
.card .ic.sp{background:url(assets/ups.png) no-repeat;background-size:6900% 100%;border-color:transparent}
.chips .ci{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin-right:3px;background:url(assets/ups.png) no-repeat;background-size:6900% 100%}
.who{font-family:var(--f-display);font-size:20px;line-height:1;color:var(--bone);text-shadow:0 2px 0 #000}
.bar{position:relative;height:12px;margin-top:5px;background:#1a1016;border:1px solid var(--gold);box-shadow:0 0 0 2px #000}
.bar i{position:absolute;inset:0;width:100%;background:linear-gradient(#e0485e,#8c1428);transform-origin:left;transition:transform .15s}
.bar span{position:absolute;inset:0;font:9px/12px var(--f-pixel);text-align:center;color:#fff;text-shadow:0 1px 0 #000}
.bar.shb{height:8px;margin-top:4px;border-color:#9fb8d8}.bar.shb i{background:linear-gradient(#d8ecff,#5b86c0)}.bar.shb span{font-size:7px;line-height:8px;letter-spacing:.1em}
#shields b{width:13px;height:13px;background:url(assets/ui6.png) 20% 0/600% 100% no-repeat}
.u6{display:inline-block;width:13px;height:13px;vertical-align:-2px;background:url(assets/ui6.png) 0 0/600% 100% no-repeat}
#petals b{font-weight:400;margin-left:3px}
#bPause{display:flex;align-items:center;justify-content:center}
.rbox{display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:auto}
.rrow{display:flex;gap:8px;align-items:center}
#petals{font:11px var(--f-pixel);color:#f6b2c0;text-shadow:0 1px 0 #000}
#stage{font-size:11px;color:var(--mist);letter-spacing:.08em;text-shadow:0 1px 0 #000}
#quests{font-size:10.5px;line-height:1.55;text-align:right;color:#d8ccd5;text-shadow:0 1px 0 #000,0 0 4px #000;max-width:38vw}
#quests .main{color:var(--gold)}
#bPause{width:34px;height:34px;border:1px solid var(--gold);background:rgba(11,8,13,.7);font:12px var(--f-pixel);color:var(--gold)}
#bossBar{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 62px);width:min(78vw,420px);pointer-events:none;text-align:center}
#bossName{font-size:13px;font-weight:700;letter-spacing:.2em;color:var(--bone);text-shadow:0 2px 0 #000}
#bossName small{display:block;font-family:var(--f-display);font-weight:400;letter-spacing:.05em;color:var(--gold);font-size:12px}
#bossBar .bar{height:8px}
#bossBar .bar i{background:linear-gradient(#c9a45c,#7a1420)}

/* ---------- touch pad ---------- */
#stickZone{position:absolute;left:0;bottom:0;width:50%;top:18%}
#stickBase{position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;
  border:2px solid rgba(201,164,92,.55);background:radial-gradient(rgba(155,27,48,.18),rgba(11,8,13,.35));opacity:.0;transition:opacity .15s}
#stickBase.on{opacity:1}
#stickKnob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#f1e6d4,#a8927a);box-shadow:0 0 0 2px #000,0 0 12px rgba(208,64,90,.6)}
#pad{position:absolute;right:calc(env(safe-area-inset-right,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:210px;height:200px;pointer-events:none}
.pb{position:absolute;border-radius:50%;pointer-events:auto;border:2px solid var(--gold);background:radial-gradient(circle at 50% 35%,rgba(60,22,34,.92),rgba(14,8,12,.92));
  box-shadow:0 0 0 2px #000, inset 0 0 12px rgba(0,0,0,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;touch-action:none}
.pb svg{width:46%;height:46%;fill:none;stroke:var(--bone);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pb em{font-style:normal;font-size:10px;letter-spacing:.1em;color:var(--gold);line-height:1}
.pb .ico{display:none;width:66%;height:66%;margin-bottom:6px;background-size:400% 100%;background-repeat:no-repeat;filter:drop-shadow(0 1px 0 #000)}
.pb.art .ico{display:block}.pb.art svg{display:none}
.pb.art em{position:absolute;bottom:5px;font-size:9px;text-shadow:0 1px 0 #000,0 0 4px #000}
.pb.down{transform:scale(.93);background:radial-gradient(circle at 50% 35%,rgba(155,27,48,.95),rgba(30,10,16,.95))}
#bRanged{width:84px;height:84px;right:0;bottom:6px}
#bMelee{width:64px;height:64px;right:96px;bottom:0}
#bDash{width:56px;height:56px;right:104px;bottom:80px}
#bSkill{width:64px;height:64px;right:12px;bottom:102px;--cd:0}
#bSkill::after{content:"";position:absolute;inset:-2px;border-radius:50%;pointer-events:none;
  background:conic-gradient(rgba(0,0,0,.72) calc(var(--cd)*360deg),transparent 0)}
#bSkill.ready{box-shadow:0 0 0 2px #000,0 0 16px rgba(201,164,92,.8)}
#bDash{--cd:0}
#bDash::after{content:"";position:absolute;inset:-2px;border-radius:50%;pointer-events:none;background:conic-gradient(rgba(0,0,0,.65) calc(var(--cd)*360deg),transparent 0)}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-size:12px;color:var(--mist);
  background:rgba(11,8,13,.7);padding:6px 12px;border:1px solid var(--line);white-space:nowrap;pointer-events:none}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
#title{display:flex;flex-direction:column;align-items:center;text-align:center;background:linear-gradient(rgba(11,8,13,.55),rgba(11,8,13,0) 62%)}
.t-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:6vh;max-width:30rem}
.t-eyebrow{font-family:var(--f-display);font-size:18px;color:var(--gold);letter-spacing:.04em}
.t-logo{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(54px,17vw,96px);line-height:.9;color:var(--bone);
  text-shadow:0 0 18px rgba(155,27,48,.75),0 4px 0 #000}
.t-sub{font-weight:900;letter-spacing:.6em;font-size:18px;color:var(--rose);margin-right:-.6em}
.t-line{font-size:13px;line-height:1.9;color:#c9bfc9;margin:6px 0 4px;text-wrap:balance}
.t-best{font:10px var(--f-pixel);color:var(--mist);min-height:12px}
.t-note{font-size:11px;color:#6d6475;margin-top:4px}
.cta{min-width:180px;padding:12px 28px;border:2px solid var(--gold);background:linear-gradient(#7a1528,#3e0a16);font-size:18px;font-weight:900;
  letter-spacing:.5em;text-indent:.5em;color:var(--bone);box-shadow:0 0 0 2px #000,0 6px 18px rgba(155,27,48,.45)}
.cta:active{transform:translateY(1px)}
.ghost{border:1px solid var(--line);background:rgba(11,8,13,.6);padding:8px 12px;font-size:14px;color:var(--bone)}

#select{background:rgba(11,8,13,.92);padding-bottom:0;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.selL,.selR{display:flex;flex-direction:column;gap:12px;min-width:0}
.sel-head{display:flex;align-items:center;gap:12px}
.sel-head h2{margin:0;font-size:18px;letter-spacing:.3em;font-weight:900}
.sel-main{display:flex;gap:14px;align-items:flex-start}
.stage{flex:0 0 auto;width:112px;height:150px;position:relative;border:1px solid var(--line);
  background:radial-gradient(ellipse at 50% 0%,rgba(236,226,210,.22),transparent 60%),linear-gradient(#170b11,#0b080d);display:flex;align-items:flex-end;justify-content:center}
#selCv{width:112px;height:150px;image-rendering:pixelated}
.info{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px}
.pname{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--bone)}
.preal{font-size:13px;color:var(--mist)}
.motto{font-size:15px;color:var(--rose);font-weight:700;letter-spacing:.1em}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:4px 0;font-size:12px;align-items:center}
.stats dt{color:var(--mist)}
.stats dd{margin:0;display:flex;gap:3px}
.stats dd i{width:14px;height:7px;background:#2a1c24}
.stats dd i.on{background:var(--gold)}
.abil{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.55}
.abil li{display:grid;grid-template-columns:3.2em 1fr;gap:8px;border-top:1px solid var(--line);padding-top:6px}
.abil b{color:var(--gold);font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tab{border:1px solid var(--line);background:#120a0f;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;min-width:0}
.tab canvas{width:30px;height:44px;image-rendering:pixelated}
.tab span{font-family:var(--f-display);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab.on{border-color:var(--gold);background:#2a0e18;box-shadow:inset 0 0 12px rgba(201,164,92,.25)}
#go{align-self:center}
.gobar{position:sticky;bottom:0;margin:0 calc(-1*max(16px,env(safe-area-inset-right,0px))) 0 calc(-1*max(16px,env(safe-area-inset-left,0px)));display:flex;justify-content:center;
  padding:12px 0 calc(env(safe-area-inset-bottom,0px) + 16px);background:linear-gradient(rgba(11,8,13,0),rgba(11,8,13,.96) 30%)}
.kbd{font-size:11px;color:#6d6475;text-align:center}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(6,3,6,.78);display:flex;align-items:center;justify-content:center;overflow-y:auto;touch-action:pan-y;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.panel{width:min(100%,26rem);margin:auto;border:1px solid var(--gold);background:linear-gradient(#1a0c13,#0d080b);box-shadow:0 0 0 3px #000,0 20px 60px rgba(0,0,0,.7);
  padding:18px 16px;display:flex;flex-direction:column;gap:12px;text-align:center}
.panel h3{margin:0;font-size:20px;font-weight:900;letter-spacing:.3em}
.panel h3.big{font-family:var(--f-display);font-weight:400;font-size:44px;letter-spacing:.02em;color:var(--bone)}
.panel .sub{margin:0;color:var(--mist);font-size:12.5px;line-height:1.7}
.cards{display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto auto;column-gap:10px;text-align:left;align-items:center;
  padding:10px 12px;border:1px solid var(--line);background:#140a10;font-size:12.5px;line-height:1.5}
.card .ic{grid-row:1/3;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:1px solid currentColor;font-size:20px}
.card b{font-size:15px}
.card .d{color:#c9bfc9}
.card .rt{font-size:10px;letter-spacing:.2em;margin-left:6px;opacity:.9}
.card.r0{color:var(--bone)} .card.r1{color:#f08aa0;border-color:#5a2232} .card.r2{color:var(--gold);border-color:#6a5530;background:#1a130a}
.card .d,.card b{color:var(--bone)}
.card:disabled{opacity:.38}
.card .price{font:11px var(--f-pixel);color:#f6b2c0}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.chips span{font-size:11px;padding:3px 7px;border:1px solid var(--line);color:#c9bfc9}
.tog{display:flex;justify-content:space-between;align-items:center;font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.tog button{min-width:64px}
.talk{display:grid;grid-template-columns:72px 1fr;gap:12px;text-align:left;align-items:start}
.talk .port.big{width:72px;height:108px;margin:0}
.talk canvas{width:72px;height:72px;image-rendering:pixelated;border:1px solid var(--line);background:radial-gradient(circle at 50% 30%,#3a1622,#0d080b)}
.tk{min-width:0}.tk b{font-size:16px;color:var(--gold)}.tk small{display:block;color:var(--mist);font-size:12px;margin-top:2px}.tk p{margin:6px 0 0;font-size:14px;line-height:1.75}
.bond{font-size:12.5px;color:#c9bfc9;border:1px dashed #5a2232;padding:7px 10px}
.bond.got{font-size:15px;color:var(--gold);border-color:var(--gold)}.bond.got span{font-size:12.5px;color:#c9bfc9}
.chips span.bd{border-color:#5a3a7a;color:#d8c0ff}
.story{margin:0;font-size:14px;line-height:2;white-space:pre-line;color:#ddd2da;text-align:left}
.frags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.frags span{font-size:11px;border:1px solid var(--line);padding:3px 8px;color:#6d6475}
.frags span b{color:inherit;margin-right:4px;font-weight:900}
.frags span.on{border-color:var(--gold);color:var(--gold);background:#1e1508}
.qlog{text-align:left;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.qh{font-size:12px;letter-spacing:.3em;color:var(--mist)}
.qlog ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.qlog li{display:grid;grid-template-columns:1fr auto;column-gap:8px;font-size:13px}
.qlog li small{grid-column:1/3;color:var(--mist);font-size:11.5px}
.qlog li span{font:11px var(--f-pixel);color:var(--gold)}
.qlog li.main b{color:var(--gold)}
.qlog li.done{opacity:.55}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px}
.summary div{border:1px solid var(--line);padding:8px 4px}
.summary b{display:block;font:14px var(--f-pixel);color:var(--gold)}

/* ---------- act card & fade ---------- */
#actCard{position:fixed;inset:0;background:#050305;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;
  padding:0 max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px));opacity:0;transition:opacity .6s}
#actCard.show{opacity:1}
#actCard .an{font-family:var(--f-display);font-size:26px;color:var(--gold)}
#actCard svg{width:64px;height:64px;stroke:var(--rose);stroke-width:3;fill:none}
#actCard h2{margin:0;font-size:30px;font-weight:900;letter-spacing:.4em;margin-right:-.4em}
#actCard p{margin:0;max-width:22em;font-size:14px;line-height:2;color:#bdb3bf;white-space:pre-line}
#actCard small{color:#5e5566;font-size:11px;margin-top:18px}
#cut{position:fixed;inset:0;cursor:pointer;touch-action:none}
#cutSkip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 12px);border:1px solid #5a4520;background:rgba(0,0,0,.6);color:var(--gold);font-size:13px;padding:6px 12px;letter-spacing:.1em}
#cutSub{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 3%);transform:translateX(-50%);width:min(88vw,46rem);text-align:center;display:flex;flex-direction:column;gap:3px;text-shadow:0 2px 0 #000;pointer-events:none}
#cutWho{font-size:13px;color:var(--gold);letter-spacing:.25em;min-height:1em}
#cutTxt{font-size:16px;line-height:1.7;color:#f0e6dc;min-height:1.7em}
#game.cut #hud,#game.cut #pad,#game.cut #stickZone,#game.cut #bossBar,#game.cut #vig,#game.cut #tint,#game.cut #secBanner,#game.cut #toast{display:none!important}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .28s}
#fade.on{opacity:1}
#secBanner{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .5s;display:flex;flex-direction:column;gap:2px;max-width:70vw;text-shadow:0 2px 0 #000,0 0 10px #000}
#secBanner.on{opacity:1}
#secBanner small{font-size:11px;letter-spacing:.3em;color:var(--gold)}#secBanner b{font-size:20px;font-weight:900;letter-spacing:.15em}#secBanner span{font-size:12px;color:#d8ccd5}
#actCard .feat{font-size:13px;color:var(--gold);border:1px solid #5a4520;padding:6px 12px;display:flex;flex-direction:column;gap:2px}#actCard .feat span{color:#cfc4cd;font-size:12px}#actCard .capt{font-size:13px;color:var(--rose)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translateX(-50%);font-size:14px;letter-spacing:.2em;font-weight:700;color:var(--bone);
  text-shadow:0 2px 0 #000,0 0 12px rgba(155,27,48,.9);pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
#toast.on{opacity:1}
#rotate{display:none;position:fixed;inset:0;z-index:60;background:var(--ink);flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
#rotate svg{width:84px;height:84px;fill:none;stroke:var(--gold);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;animation:tilt 2.4s ease-in-out infinite}
#rotate b{font-size:20px;letter-spacing:.3em;font-weight:900;margin-right:-.3em}
#rotate span{font-size:13px;color:var(--mist)}
@keyframes tilt{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
@media (orientation:landscape) and (max-height:560px){
  #title{align-items:flex-start;justify-content:center;text-align:left;background:linear-gradient(90deg,rgba(11,8,13,.8),rgba(11,8,13,.35) 45%,rgba(11,8,13,0) 62%)}
  .t-wrap{margin:auto 0;align-items:flex-start;max-width:min(50vw,30rem);gap:6px}
  .t-eyebrow{font-size:15px}
  .t-logo{font-size:min(11vw,21vh)}
  .t-sub{font-size:16px}
  .t-line{font-size:12px;line-height:1.75;margin:2px 0}
  .cta{padding:9px 24px;font-size:16px}
  #select{flex-direction:row;gap:20px;overflow:hidden;padding-bottom:0}
  .selL,.selR{flex:1 1 0;overflow-y:auto;gap:8px;padding-bottom:12px}
  .selR{padding-top:4px}
  .stage{width:96px;height:128px}
  #selCv{width:96px;height:128px}
  .pname{font-size:28px}
  .stats{margin:0}
  .abil{font-size:12px}
  .gobar{position:static;margin:auto 0 0;padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 8px);background:none}

  else if(f.k==='ring'){ctx.globalAlpha=1-k;ctx.strokeStyle=f.col;ctx.lineWidth=f.w||2;ctx.beginPath();ctx.arc(f.x,f.y,f.r0+(f.r1-f.r0)*k,0,TAU);ctx.stroke();ctx.globalAlpha=1}
  else if(f.k==='warnC'){ctx.globalAlpha=.18+.22*k;ctx.fillStyle='#e0283c';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,TAU);ctx.fill();ctx.globalAlpha=.8;ctx.strokeStyle='#ff6a7a';ctx.lineWidth=1;ctx.beginPath();ctx.arc(f.x,f.y,f.r*k,0,TAU);ctx.stroke();ctx.globalAlpha=1}
  else if(f.k==='warnR'){ctx.globalAlpha=.15+.25*k;ctx.fillStyle='#e0283c';ctx.fillRect(f.x,f.y,f.w,f.h);ctx.globalAlpha=.7;ctx.strokeStyle='#ff6a7a';ctx.lineWidth=1;ctx.strokeRect(f.x+.5,f.y+.5,f.w-1,f.h-1);ctx.globalAlpha=1}
  else if(f.k==='spike'){ctx.globalAlpha=1-k*k;ctx.fillStyle='#2f6a34';const vert=f.h>f.w;for(let i=0;i<(vert?f.h:f.w);i+=6){const h=8+Math.sin(i)*3;if(vert){ctx.fillRect(f.x+4,f.y+i,f.w-8,3);ctx.fillStyle='#c8304a';ctx.fillRect(f.x+f.w/2-1,f.y+i,2,2);ctx.fillStyle='#2f6a34'}else{ctx.beginPath();ctx.moveTo(f.x+i,f.y+f.h-2);ctx.lineTo(f.x+i+3,f.y+f.h-2-h-6);ctx.lineTo(f.x+i+6,f.y+f.h-2);ctx.fill()}}ctx.globalAlpha=1}
  else if(f.k==='line'){ctx.globalAlpha=.25+.4*k;ctx.strokeStyle='#e0283c';ctx.lineWidth=f.w||2;ctx.beginPath();ctx.moveTo(f.x,f.y-6);ctx.lineTo(f.x+Math.cos(f.a)*f.len,f.y-6+Math.sin(f.a)*f.len);ctx.stroke();ctx.globalAlpha=1}
  else if(f.k==='sum'){ctx.globalAlpha=.6;ctx.strokeStyle='#c9a45c';ctx.lineWidth=1;const r=10*(1-k*.3);ctx.beginPath();ctx.ellipse(f.x,f.y,r,r*.5,0,0,TAU);ctx.stroke();
    ctx.beginPath();for(let i=0;i<5;i++){const a=f.t*3+i*TAU*2/5;ctx.lineTo(f.x+Math.cos(a)*r,f.y+Math.sin(a)*r*.5)}ctx.closePath();ctx.stroke();ctx.globalAlpha=1}
  else if(f.k==='bolt'){ctx.globalAlpha=1-k;ctx.strokeStyle='#cfe0ff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(f.x,f.y);const n=5;for(let i=1;i<=n;i++){const q=i/n;ctx.lineTo(f.x+(f.x2-f.x)*q+(i<n?rnd(-4,4):0),f.y+(f.y2-f.y)*q)}ctx.stroke();ctx.globalAlpha=1}
  else if(f.k==='starfall'){const y0=f.y-90;const yy=y0+(f.y-y0)*k;ctx.drawImage(SPR.star,Math.round(f.x+ (1-k)*20)-3,Math.round(yy)-3);ctx.globalAlpha=.4;ctx.strokeStyle='#ffe9a0';ctx.beginPath();ctx.moveTo(f.x+(1-k)*20+6,yy-12);ctx.lineTo(f.x+(1-k)*20,yy);ctx.stroke();ctx.globalAlpha=1}}
function drawAmb(t){for(const a of G.amb){const x=Math.round(a.x),y=Math.round(a.y);
  if(a.k==='ember'){ctx.fillStyle=Math.sin(t*8+a.ph)>0?'#ff9a3a':'#ffd27a';ctx.globalAlpha=.7;ctx.fillRect(x,y,1,1)}
  else if(a.k==='feather'){ctx.globalAlpha=.6;ctx.fillStyle='#2a2232';ctx.fillRect(x,y,2,1);ctx.fillRect(x+1,y+1,2,1)}
  else if(a.k==='bubble'){ctx.globalAlpha=.4;ctx.strokeStyle='#9ad8ff';ctx.lineWidth=.6;ctx.beginPath();ctx.arc(x,y,1.5*a.s,0,TAU);ctx.stroke()}
  else if(a.k==='leaf'){ctx.globalAlpha=.6;ctx.fillStyle=Math.sin(a.ph)>0?'#2f6a34':'#7a1a20';ctx.fillRect(x,y,2,1)}
  else{ctx.globalAlpha=.75;ctx.fillStyle=Math.sin(a.ph)>0?'#c8304a':'#e05a70';ctx.fillRect(x,y,2,1);ctx.fillRect(x+Math.round(Math.sin(t*3+a.ph)),y+1,1,1)}}ctx.globalAlpha=1}
function drawTitleScene(){const t=G.time;ctx.setTransform(SC,0,0,SC,0,0);
  const g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#0b0609');g.addColorStop(.6,'#1a0a12');g.addColorStop(1,'#080406');ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  // curtains
  for(let i=0;i<VW;i+=8){ctx.fillStyle=i%16?'#4a0c18':'#3a0912';ctx.fillRect(i,0,8,VH*.18+Math.sin(i*.3)*3)}ctx.fillStyle=GOLD;for(let i=0;i<VW;i+=4)ctx.fillRect(i,Math.round(VH*.18+Math.sin(i*.3)*3),2,1);
  for(let x=-10;x<24;x+=6){ctx.fillStyle=x%12?'#5a0e1c':'#420a14';ctx.fillRect(x,0,6,VH*.9);ctx.fillRect(VW-x-6,0,6,VH*.9)}
  const fy=Math.round(VH*.86);ctx.fillStyle='#1c1014';ctx.fillRect(0,fy,VW,VH-fy);ctx.fillStyle='#2a1a1e';for(let x=0;x<VW;x+=12)ctx.fillRect(x,fy,11,1);ctx.fillStyle=GOLD;ctx.fillRect(0,fy,VW,1);
  const n=CHARS.length,land=VW>VH,cx0=land?VW*.73:VW/2,gap=Math.min(36,((land?VW*.5:VW)-30)/n);
  CHARS.forEach((c,i)=>{const x=cx0+(i-(n-1)/2)*gap;ctx.globalAlpha=.10+.04*Math.sin(t*1.4+i);ctx.fillStyle='#fff3dc';ctx.beginPath();ctx.moveTo(x-3,0);ctx.lineTo(x+3,0);ctx.lineTo(x+14,fy);ctx.lineTo(x-14,fy);ctx.fill();
    ctx.globalAlpha=.25;ctx.beginPath();ctx.ellipse(x,fy+1,12,3,0,0,TAU);ctx.fill();ctx.globalAlpha=1;shadow(x,fy,6);
    const art=ART.fr[c.id];if(art){const run=G.state==='select'&&i===G.charIdx,fr=run?art.run:art.idle;drawSpr(fr[Math.floor(t*(run?10:4)+i*3)%fr.length],x,fy+2,i<2?1:-1,null,.5)}
    else{const s=SPR['ch_'+c.id];const fi=G.state==='select'&&i===G.charIdx?[1,0,2,0][Math.floor(t*6)%4]:0;drawSpr(s.f[fi],x,fy+1-(Math.sin(t*2+i)>.95?1:0),i<2?1:-1)}});
  drawAmb(t)}
function drawSel(){const c=$('selCv'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.imageSmoothingEnabled=false;const s=SPR['ch_'+CHARS[G.charIdx].id];
  const f=Math.floor(G.selT*2)%8===3?0:0;x.fillStyle='rgba(0,0,0,.45)';x.beginPath();x.ellipse(75,190,34,7,0,0,TAU);x.fill();
  const art=ART.fr[CHARS[G.charIdx].id];if(art){x.drawImage(art.idle[Math.floor(G.selT*5)%art.idle.length],18,0,72,72,-15,14,180,180);return}
  const bob=Math.round(Math.sin(G.selT*2.4)*2);x.drawImage(s.f[f],0,0,20,29,15,10+bob,120,174)}

/* =================================================================== boot */
$('cut').addEventListener('click',()=>cutNext());$('cutSkip').addEventListener('click',e=>{e.stopPropagation();endCut()});
function boot(){resize();buildSprites();loadArt();buildTabs();selChar(0);toTitle();if(!isTouch)$('kbdHint').textContent='键盘：WASD 移动 · J 近战 · K 远程 · L 闪避 · 空格 技能 · Esc 暂停';requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(G.state==='play'&&!CUT.on&&modal.hidden&&$('actCard').hidden)showPause();if(A.ctx)A.ctx.suspend()}else if(A.ctx)A.ctx.resume()});
boot();
</script>
